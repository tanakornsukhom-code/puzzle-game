<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6d987"><title>เหมียวป่วนคาเฟ่ • Tricky Pet Café</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game"><header><button id="levels" aria-label="เลือกด่าน">☰</button><span class="brand">เหมียวป่วน<span>คาเฟ่</span></span><button id="sound" aria-label="เปิดปิดเสียง">♪</button></header><section class="order"><div class="meta"><span id="levelLabel"></span><span id="progress"></span></div><h1 id="question"></h1><p id="subtitle"></p></section><div class="bubble" id="bubble" aria-live="polite"></div><section id="scene" aria-label="ฉากคาเฟ่ปริศนา"><div class="wall-fallback"></div><div class="sign">เมนูวันนี้<br><b>อะไรก็ได้…จริงเหรอ?</b></div><div id="objects"></div><div id="effect"></div></section><div class="scene-caption">คาเฟ่นี้รับทุกออเดอร์…แบบตรงตัว</div><div id="toast" role="status" aria-live="polite">ลองแตะหรือลากสิ่งของในร้านดูสิ</div><footer><button id="reset">↻ <span>เริ่มใหม่</span></button><span class="gesture">แตะเลือก → แตะเป้าหมาย<br>หรือลากวางได้เลย</span><button id="hint">☀ <span>คำใบ้</span></button></footer><div class="dots" id="dots"></div></main><dialog id="modal"><div id="modalBody"></div></dialog><script src="game.js"></script></body></html>
